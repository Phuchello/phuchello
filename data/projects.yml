      - Python 3.12
      - FastAPI (Async)
      - PostgreSQL 16 + pgvector
      - SQLAlchemy 2.x / asyncpg
      - Alembic Migrations
      - Docker Compose
    featured: true
    status: "Active (G2 Ingestion Review)"
