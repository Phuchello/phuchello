projects:
  - name: "Intel OS (NCKH)"
    repo: "Phuchello/NCKH"
    category: "Research Intelligence & Systems"
    tagline: "A personal system for collecting, reconciling, and retrieving research literature."
    description: >
      Built around asynchronous metadata ingestion from arXiv, Crossref, OpenAlex, and Semantic Scholar,
      with PostgreSQL/pgvector for storage and retrieval.
    tech:
      - Python 3.12
      - FastAPI (Async)
      - PostgreSQL 16 + pgvector
      - SQLAlchemy 2.x / asyncpg
      - Alembic Migrations
      - Docker Compose
    featured: true
    status: "Active"
    priority: 1
    links:
      repository: "https://github.com/Phuchello/NCKH"
      docs: "https://github.com/Phuchello/NCKH/blob/main/docs/PUBLIC_PROGRESS.md"

