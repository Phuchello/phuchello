  - name: "Intel OS (NCKH)"
    repo: "Phuchello/NCKH"
    category: "Research Intelligence & Systems"
    tagline: "A personal scientific intelligence platform turning massive literature into provenance-aware research memory"
    description: >
      A research-engineering platform built around an Intelligence Lake, Personal Research Memory,
      and Research Opportunity Memory. Engineered with a modular monolith architecture, async HTTP ingestion
