# Technical Capabilities Grouped Strictly by System Layer
# This architecture prevents unstructured badge clutter and emphasizes technical discipline.

layers:
  - name: "NETWORKING"
    description: "Transport protocols, socket programming, and packet inspection"
    icon: "NETWORK"
    items:
      - name: "TCP/IP & UDP"
        detail: "Stream framing, datagram boundaries, 3-way handshake mechanics"
        level: "Demonstrated"
      - name: "Socket Programming"
        detail: "Client-server architectures, non-blocking I/O, multi-client concurrency"
        level: "Demonstrated"
      - name: "Application Protocols"
        detail: "HTTP/1.1, REST APIs, SMTP, POP3, IMAP, FTP"
        level: "Demonstrated"
      - name: "Packet Analysis & Diagnostics"
        detail: "Packet analysis with Wireshark, display filters, RAW socket packet capture"
        level: "Demonstrated"
      - name: "Security Fundamentals"
        detail: "AES-256 payload encryption, SHA-256 integrity hashing"
        level: "Demonstrated"

  - name: "EDGE & AIoT"
    description: "Physical sensing, microcontroller interfacing, and distributed telemetry"
    icon: "EDGE"
    items:
      - name: "ESP32 & Microcontrollers"
        detail: "Hardware GPIO control, sensor polling, serial communication"
        level: "Practicing"
      - name: "MQTT Protocol"
        detail: "Lightweight pub/sub messaging, QoS levels, telemetry transport"
        level: "Practicing"
      - name: "Sensors & Peripherals"
        detail: "Analog/digital data acquisition, environment telemetry"
        level: "Practicing"
      - name: "Edge Telemetry Pipelines"
        detail: "Local data filtering, sensor dispatch to service gateways"
        level: "Exploring"

  - name: "SYSTEMS & DATA CORE"
    description: "Operating system primitives, data engines, and foundational tooling"
    icon: "SYSTEMS"
    items:
      - name: "Linux / POSIX"
        detail: "Shell scripting, process management, file I/O streams"
        level: "Practicing"
      - name: "PostgreSQL 16"
        detail: "Relational modeling, async drivers (asyncpg), ACID transactions, Alembic migrations"
        level: "Demonstrated"
      - name: "Docker & Compose"
        detail: "Multi-container service environments, reproducible local setups"
        level: "Practicing"
      - name: "C / C++"
        detail: "Manual memory allocation, pointer mechanics, algorithmic optimization"
        level: "Demonstrated"
      - name: "Git Workflows"
        detail: "Branching, version control, and repository workflows"
        level: "Practicing"

  - name: "DEVOPS & INFRASTRUCTURE"
    description: "Deployment environments, CI/CD automation, and async service design"
    icon: "CLOUD"
    items:
      - name: "Multi-Container Services"
        detail: "Docker Compose service configuration, health checks, volume management"
        level: "Practicing"
      - name: "CI/CD Automation"
        detail: "GitHub Actions workflows, automated testing, schema verification"
        level: "Practicing"
      - name: "Async Service Design"
        detail: "Asynchronous task execution, retry/backoff policies, rate limiting"
        level: "Demonstrated"

  - name: "INTELLIGENCE & RESEARCH"
    description: "Scientific data ingestion, vector search, and provenance engineering"
    icon: "INTELLIGENCE"
    items:
      - name: "Python 3.12 Ecosystem"
        detail: "FastAPI async, Pydantic v2 validation, SQLAlchemy 2.0 async ORM"
        level: "Demonstrated"
      - name: "Vector Search"
        detail: "Vector search with pgvector, similarity retrieval"
        level: "Demonstrated"
      - name: "Scientific Ingestion"
        detail: "Metadata pipelines for arXiv, Crossref, OpenAlex, Semantic Scholar"
        level: "Demonstrated"
      - name: "Provenance Modeling"
        detail: "Durable evidence-to-claim lineage, idempotent record reconciliation"
        level: "Demonstrated"

public_summary:
  - area: "Networking"
    tools: "TCP/IP · UDP · Sockets · HTTP · Wireshark"
  - area: "Edge / AIoT"
    tools: "ESP32 · MQTT · Sensors · Telemetry"
  - area: "Systems"
    tools: "Linux · POSIX · Docker · Git"
  - area: "Data / Research"
    tools: "Python · FastAPI · PostgreSQL · pgvector · SQL"
