<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="320" style="background: transparent;">
  <defs>
    <linearGradient id="topBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111D38"/>
      <stop offset="100%" stop-color="#091024"/>
    </linearGradient>

    <filter id="topGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#00E5FF" />
    </marker>
    <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#22C55E" />
    </marker>
  </defs>

  <style>
    .t-mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
    .header-text { font-size: 11px; fill: #64748B; font-weight: 600; letter-spacing: 1.5px; }
    .badge-label { font-size: 8px; font-weight: 700; letter-spacing: 0.5px; }
    .box-title { font-size: 11.5px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.8px; }
    .box-desc { font-size: 9px; fill: #94A3B8; }
    .box-proto { font-size: 8.5px; font-weight: 600; }
    .note-text { font-size: 8.5px; fill: #64748B; font-style: italic; }
  </style>

  <!-- Frame Outer -->
  <rect x="2" y="2" width="876" height="316" rx="8" fill="url(#topBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Diagram Title Header Bar -->
  <g transform="translate(24, 28)">
    <text x="0" y="0" class="t-mono header-text">TOPOLOGY MAP // <tspan fill="#00E5FF">EDGE-TO-CLOUD RESEARCH &amp; SYSTEMS TRAJECTORY</tspan></text>
    <text x="560" y="0" class="t-mono note-text">* Conceptual architecture map of engineering focus</text>
    <line x1="0" y1="10" x2="832" y2="10" stroke="#1E293B" stroke-width="1"/>
  </g>

  <!-- TOP ROW: EDGE & LOCAL TRANSPORT (Left to Right) -->
  
  <!-- 1. Physical Sensing Layer -->
  <g transform="translate(24, 58)">
    <rect x="0" y="0" width="180" height="96" rx="6" fill="url(#cardGrad)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="180" height="20" rx="6" fill="#00E5FF" fill-opacity="0.12"/>
    <text x="10" y="14" class="t-mono badge-label" fill="#00E5FF">LAYER 01 // SENSING</text>
    <text x="10" y="40" class="t-mono box-title">Physical Sensors</text>
    <text x="10" y="56" class="t-mono box-desc">• Environment / Telemetry</text>
    <text x="10" y="70" class="t-mono box-desc">• Analog / Digital GPIO</text>
    <text x="10" y="86" class="t-mono box-proto" fill="#00E5FF">I2C / SPI / Serial ADC</text>
  </g>

  <!-- Connector: Sensing -> ESP32 -->
  <g transform="translate(204, 106)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3, 3" marker-end="url(#arrowCyan)"/>
    <text x="14" y="-6" class="t-mono" font-size="7.5" fill="#64748B" text-anchor="middle">GPIO</text>
  </g>

  <!-- 2. Edge Processing Layer -->
  <g transform="translate(238, 58)">
    <rect x="0" y="0" width="180" height="96" rx="6" fill="url(#cardGrad)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="180" height="20" rx="6" fill="#00E5FF" fill-opacity="0.12"/>
    <text x="10" y="14" class="t-mono badge-label" fill="#00E5FF">LAYER 02 // EDGE MCU</text>
    <text x="10" y="40" class="t-mono box-title">ESP32 / Microcontroller</text>
    <text x="10" y="56" class="t-mono box-desc">• Local Frame Filtering</text>
    <text x="10" y="70" class="t-mono box-desc">• Edge Payload Packaging</text>
    <text x="10" y="86" class="t-mono box-proto" fill="#00E5FF">MQTT Client / C++</text>
  </g>

  <!-- Connector: ESP32 -> Network / Gateway -->
  <g transform="translate(418, 106)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3, 3" marker-end="url(#arrowBlue)"/>
    <text x="14" y="-6" class="t-mono" font-size="7.5" fill="#38BDF8" text-anchor="middle">MQTT</text>
  </g>

  <!-- 3. Network Transport & Observability Layer -->
  <g transform="translate(452, 58)">
    <rect x="0" y="0" width="190" height="96" rx="6" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="190" height="20" rx="6" fill="#38BDF8" fill-opacity="0.12"/>
    <text x="10" y="14" class="t-mono badge-label" fill="#38BDF8">LAYER 03 // TRANSPORT</text>
    <text x="10" y="40" class="t-mono box-title">Network &amp; Sockets</text>
    <text x="10" y="56" class="t-mono box-desc">• TCP/IP Framing &amp; UDP</text>
    <text x="10" y="70" class="t-mono box-desc">• RAW Socket Packet Capture</text>
    <text x="10" y="86" class="t-mono box-proto" fill="#38BDF8">Wireshark / TLS / NT106</text>
  </g>

  <!-- Connector: Transport -> Gateway Hub -->
  <g transform="translate(642, 106)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="14" y="-6" class="t-mono" font-size="7.5" fill="#38BDF8" text-anchor="middle">TCP/IP</text>
  </g>

  <!-- 4. Distributed Broker / Ingestion Gateway -->
  <g transform="translate(676, 58)">
    <rect x="0" y="0" width="180" height="96" rx="6" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="180" height="20" rx="6" fill="#818CF8" fill-opacity="0.12"/>
    <text x="10" y="14" class="t-mono badge-label" fill="#818CF8">LAYER 04 // GATEWAY</text>
    <text x="10" y="40" class="t-mono box-title">Ingestion &amp; Dispatch</text>
    <text x="10" y="56" class="t-mono box-desc">• MQTT Broker &amp; HTTP APIs</text>
    <text x="10" y="70" class="t-mono box-desc">• Academic Source Feeders</text>
    <text x="10" y="86" class="t-mono box-proto" fill="#818CF8">FastAPI Async / Docker</text>
  </g>

  <!-- Vertical Bus Connecting Top Row to Bottom Row -->
  <g transform="translate(766, 154)">
    <line x1="0" y1="0" x2="0" y2="34" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3, 3"/>
    <polyline points="0,34 -320,34 -320,44" fill="none" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="-160" y="28" class="t-mono" font-size="7.5" fill="#818CF8" text-anchor="middle">RECONCILED PAYLOAD DISPATCH</text>
  </g>

  <!-- BOTTOM ROW: DATA CORE & RESEARCH INTELLIGENCE -->

  <!-- 5. Cloud & Data Persistence Layer -->
  <g transform="translate(130, 202)">
    <rect x="0" y="0" width="280" height="96" rx="6" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="280" height="20" rx="6" fill="#818CF8" fill-opacity="0.12"/>
    <text x="12" y="14" class="t-mono badge-label" fill="#818CF8">LAYER 05 // DATA ENGINE &amp; PERSISTENCE</text>
    <text x="12" y="40" class="t-mono box-title">PostgreSQL 16 Core</text>
    <text x="12" y="56" class="t-mono box-desc">• Relational Schema &amp; Alembic Migrations</text>
    <text x="12" y="70" class="t-mono box-desc">• SQLA 2.x Async / asyncpg Engine</text>
    <text x="12" y="86" class="t-mono box-proto" fill="#818CF8">ACID Transactions / Provenance Records</text>
  </g>

  <!-- Connector: Data Persistence -> Intelligence Memory -->
  <g transform="translate(410, 250)">
    <line x1="0" y1="0" x2="56" y2="0" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="28" y="-6" class="t-mono" font-size="7.5" fill="#22C55E" text-anchor="middle">VECTOR &amp; GRAPH</text>
  </g>

  <!-- 6. Research Intelligence Layer (Intel OS) -->
  <g transform="translate(472, 202)">
    <rect x="0" y="0" width="384" height="96" rx="6" fill="url(#cardGrad)" stroke="#22C55E" stroke-width="1.2" stroke-opacity="0.9"/>
    <rect x="0" y="0" width="384" height="20" rx="6" fill="#22C55E" fill-opacity="0.15"/>
    <text x="12" y="14" class="t-mono badge-label" fill="#22C55E">LAYER 06 // RESEARCH INTELLIGENCE (FLAGSHIP)</text>
    <text x="12" y="40" class="t-mono box-title">Intel OS — Personal Scientific Memory</text>
    <text x="12" y="56" class="t-mono box-desc">• pgvector Semantic Similarity &amp; Hybrid Search Index</text>
    <text x="12" y="70" class="t-mono box-desc">• Lineage: Source → Document → Claim → Gap → Opportunity</text>
    <text x="12" y="86" class="t-mono box-proto" fill="#22C55E">Deterministic Gate Architecture (G0 → G1 → G2)</text>
  </g>
</svg>
