<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220" style="background: transparent;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111C35"/>
      <stop offset="100%" stop-color="#0A1124"/>
    </linearGradient>

    <!-- Drop Shadows / Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .title { font-weight: 700; fill: #F8FAFC; letter-spacing: 2px; }
    .tagline { font-size: 11px; fill: #94A3B8; letter-spacing: 1px; }
    .status-text { font-size: 9px; fill: #22C55E; font-weight: 600; }
    .node-title { font-size: 11px; font-weight: 700; fill: #00E5FF; letter-spacing: 1.5px; }
    .node-sub { font-size: 8.5px; fill: #64748B; letter-spacing: 0.5px; }
    .telemetry { font-size: 9px; fill: #38BDF8; font-weight: 500; }
    .bracket { fill: #334155; }
  </style>

  <!-- Frame Outer -->
  <rect x="2" y="2" width="896" height="216" rx="8" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Subtle Grid Pattern -->
  <rect x="4" y="4" width="892" height="212" rx="6" fill="url(#grid)" />

  <!-- Terminal Top Bar -->
  <rect x="2" y="2" width="896" height="32" rx="8" fill="#0A1120" stroke="#1E293B" stroke-width="1"/>
  <!-- Status Dots -->
  <circle cx="20" cy="18" r="4" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="34" cy="18" r="4" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="48" cy="18" r="4" fill="#22C55E" fill-opacity="0.8"/>

  <!-- NOC Terminal Title -->
  <text x="70" y="21" class="mono" font-size="10.5" fill="#64748B" font-weight="600">SYS_ID // </text>
  <text x="125" y="21" class="mono" font-size="10.5" fill="#00E5FF" font-weight="600">NOC-TERMINAL-PHUCHELLO</text>
  
  <!-- Right Status Indicators -->
  <circle cx="760" cy="18" r="3" fill="#22C55E" filter="url(#glow)"/>
  <text x="770" y="21" class="mono status-text">STATUS: ACTIVE RESEARCH</text>
  <text x="860" y="21" class="mono" font-size="9" fill="#475569">v2.4</text>

  <!-- Main Hero Block -->
  <!-- Left Identity Info -->
  <g transform="translate(30, 52)">
    <text x="0" y="24" class="mono title" font-size="22">VÕ TRỌNG PHÚC</text>
    <text x="0" y="44" class="mono tagline" fill="#38BDF8">NETWORK ENGINEERING · AIoT · RESEARCH SYSTEMS</text>
    <text x="0" y="62" class="mono" font-size="9.5" fill="#64748B">LOC: UIT (VNU-HCM) | PROVENANCE-AWARE DISTRIBUTED INTELLIGENCE</text>
  </g>

  <!-- Telemetry Badge (Top Right) -->
  <g transform="translate(640, 50)">
    <rect x="0" y="0" width="225" height="42" rx="4" fill="#0D172E" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="16" class="mono" font-size="8.5" fill="#64748B">FRAME: <tspan fill="#00E5FF">802.3 Ethernet / IP</tspan></text>
    <text x="12" y="30" class="mono" font-size="8.5" fill="#64748B">FLOW: <tspan fill="#22C55E">SYN → ACK → ESTABLISHED</tspan></text>
  </g>

  <!-- Pipeline Network Architecture Visual (Bottom Half) -->
  <g transform="translate(30, 126)">
    <!-- Base Conduit Line -->
    <line x1="40" y1="36" x2="800" y2="36" stroke="#1E293B" stroke-width="3"/>
    <line x1="40" y1="36" x2="800" y2="36" stroke="url(#cyanLine)" stroke-width="1.5" stroke-dasharray="4, 4"/>

    <!-- Packet Pulse Indicators on line -->
    <circle cx="215" cy="36" r="2.5" fill="#00E5FF" filter="url(#glow)"/>
    <circle cx="455" cy="36" r="2.5" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="695" cy="36" r="2.5" fill="#22C55E" filter="url(#glow)"/>

    <!-- NODE 1: EDGE -->
    <g transform="translate(0, 8)">
      <rect x="0" y="0" width="170" height="56" rx="5" fill="url(#nodeBg)" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.8"/>
      <rect x="0" y="0" width="170" height="16" rx="5" fill="#00E5FF" fill-opacity="0.1"/>
      <text x="12" y="12" class="mono node-title">01 // EDGE</text>
      <text x="12" y="32" class="mono node-sub">SENSORS · MCU · ESP32</text>
      <text x="12" y="46" class="mono telemetry" font-size="8">PROTOCOL: MQTT / GPIO</text>
    </g>

    <!-- NODE 2: NETWORK -->
    <g transform="translate(240, 8)">
      <rect x="0" y="0" width="170" height="56" rx="5" fill="url(#nodeBg)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8"/>
      <rect x="0" y="0" width="170" height="16" rx="5" fill="#38BDF8" fill-opacity="0.1"/>
      <text x="12" y="12" class="mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5px">02 // NETWORK</text>
      <text x="12" y="32" class="mono node-sub">TCP/IP · SOCKETS · HTTP</text>
      <text x="12" y="46" class="mono telemetry" font-size="8">TRACE: WIRESHARK / RAW</text>
    </g>

    <!-- NODE 3: CLOUD -->
    <g transform="translate(480, 8)">
      <rect x="0" y="0" width="170" height="56" rx="5" fill="url(#nodeBg)" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.8"/>
      <rect x="0" y="0" width="170" height="16" rx="5" fill="#818CF8" fill-opacity="0.1"/>
      <text x="12" y="12" class="mono" font-size="11" font-weight="700" fill="#818CF8" letter-spacing="1.5px">03 // CLOUD</text>
      <text x="12" y="32" class="mono node-sub">POSTGRESQL · DOCKER</text>
      <text x="12" y="46" class="mono" font-size="8" fill="#818CF8" font-weight="500">SERVICES: FASTAPI ASYNC</text>
    </g>

    <!-- NODE 4: INTELLIGENCE -->
    <g transform="translate(720, 8)">
      <rect x="0" y="0" width="145" height="56" rx="5" fill="url(#nodeBg)" stroke="#22C55E" stroke-width="1.2" stroke-opacity="0.8"/>
      <rect x="0" y="0" width="145" height="16" rx="5" fill="#22C55E" fill-opacity="0.1"/>
      <text x="10" y="12" class="mono" font-size="10.5" font-weight="700" fill="#22C55E" letter-spacing="1px">04 // INTEL</text>
      <text x="10" y="32" class="mono node-sub">pgvector · PROVENANCE</text>
      <text x="10" y="46" class="mono" font-size="8" fill="#22C55E" font-weight="500">MEMORY: INTEL OS</text>
    </g>
  </g>

  <!-- Subtle Bottom Status -->
  <g transform="translate(30, 206)">
    <text x="0" y="0" class="mono" font-size="8" fill="#475569">INTERFACE: eth0 [1000BASE-T] | MTU: 1500 | ENCAPSULATION: SYSTEM_LAYER_STACK | ARCH: MODULAR_MONOLITH</text>
  </g>
</svg>
