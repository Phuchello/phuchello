name: Profile README & Schema Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Required File Hierarchy
        run: |
          echo "=== Checking Required Files ==="
          for file in \
            README.md \
            README.template.md \
            PROJECT_STATE.md \
            TODO.md \
            ANTIGRAVITY_HANDOFF.md \
            assets/network-banner.svg \
            assets/topology.svg \
            data/profile.yml \
            data/projects.yml \
            data/stack.yml \
            scripts/render_profile.py
          do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing required repository file: $file"
              exit 1
            fi
            echo "[OK] Found $file"
          done

      - name: Verify README is in Sync (No Drift)
        run: |
          echo "=== Verifying Rendered Output Sync ==="
          python scripts/render_profile.py --check

      - name: Test Profile Data Reactivity
        run: |
          echo "=== Testing profile.yml Data Reactivity ==="
          cp data/profile.yml data/profile.yml.bak
          sed -i 's/Ho Chi Minh City, Vietnam/TEST_NOC_LOCATION_XYZ/g' data/profile.yml
          python scripts/render_profile.py --output README.test.md
          if ! grep -q "TEST_NOC_LOCATION_XYZ" README.test.md; then
            echo "::error::Renderer failed to reflect profile.yml data changes"
            exit 1
          fi
          rm README.test.md
          mv data/profile.yml.bak data/profile.yml
          echo "[OK] profile.yml data reactivity verified."

      - name: Test Project Injection Reactivity
        run: |
          echo "=== Testing projects.yml Project Injection ==="
          cp data/projects.yml data/projects.yml.bak
          cat << 'EOF' >> data/projects.yml

  - name: "AIoT Edge Lab (Test Entry)"
    repo: "Phuchello/aiot-edge-lab-test"
    category: "AIoT Systems"
    tagline: "Deterministic test entry to verify renderer resilience"
    description: "Automated test artifact for verifying priority ordering and data ingestion."
    tech:
      - ESP32
      - MQTT
      - Python
    featured: true
    status: "Active"
    priority: 99
    links:
      repository: "https://github.com/Phuchello/aiot-edge-lab-test"
EOF
          python scripts/render_profile.py --output README.test.md
          if ! grep -q "AIoT Edge Lab (Test Entry)" README.test.md; then
            echo "::error::Renderer failed to include dynamic test project"
            exit 1
          fi
          rm README.test.md
          mv data/projects.yml.bak data/projects.yml
          echo "[OK] projects.yml injection test passed successfully."
