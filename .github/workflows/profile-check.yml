name: Profile README & Schema Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Required File Hierarchy
        run: |
          python -c "
          import os, sys
          required = [
              'README.md', 'README.template.md', 'PROJECT_STATE.md', 'TODO.md',
              'ANTIGRAVITY_HANDOFF.md', 'assets/network-banner.svg', 'assets/topology.svg',
              'data/profile.yml', 'data/projects.yml', 'data/stack.yml', 'scripts/render_profile.py'
          ]
          missing = [f for f in required if not os.path.isfile(f)]
          if missing:
              print(f'::error::Missing files: {missing}')
              sys.exit(1)
          print('[OK] All required files exist.')
          "

      - name: Verify README is in Sync (No Drift)
        run: python scripts/render_profile.py --check

      - name: Test Profile Data Reactivity
        run: |
          python -c "
          import shutil, subprocess, sys
          from pathlib import Path

          shutil.copy('data/profile.yml', 'data/profile.yml.bak')
          try:
              text = Path('data/profile.yml').read_text(encoding='utf-8')
              modified = text.replace('Ho Chi Minh City, Vietnam', 'TEST_NOC_LOCATION_XYZ')
              Path('data/profile.yml').write_text(modified, encoding='utf-8')

              subprocess.run([sys.executable, 'scripts/render_profile.py', '--output', 'README.test.md'], check=True)
              test_output = Path('README.test.md').read_text(encoding='utf-8')
              if 'TEST_NOC_LOCATION_XYZ' not in test_output:
                  raise AssertionError('Renderer failed to reflect profile.yml data changes')
              print('[OK] profile.yml data reactivity verified.')
          finally:
              if Path('README.test.md').exists():
                  Path('README.test.md').unlink()
              shutil.move('data/profile.yml.bak', 'data/profile.yml')
          "

      - name: Test Project Injection Reactivity
        run: |
          python -c "
          import shutil, subprocess, sys
          from pathlib import Path

          shutil.copy('data/projects.yml', 'data/projects.yml.bak')
          dummy_entry = '''

  - name: \"AIoT Edge Lab (Test Entry)\"
    repo: \"Phuchello/aiot-edge-lab-test\"
    category: \"AIoT Systems\"
    tagline: \"Deterministic test entry to verify renderer resilience\"
    description: \"Automated test artifact for verifying priority ordering and data ingestion.\"
    tech:
      - ESP32
      - MQTT
      - Python
    featured: true
    status: \"Active\"
    priority: 99
    links:
      repository: \"https://github.com/Phuchello/aiot-edge-lab-test\"
  '''
          try:
              with open('data/projects.yml', 'a', encoding='utf-8') as f:
                  f.write(dummy_entry)

              subprocess.run([sys.executable, 'scripts/render_profile.py', '--output', 'README.test.md'], check=True)
              test_output = Path('README.test.md').read_text(encoding='utf-8')
              if 'AIoT Edge Lab (Test Entry)' not in test_output:
                  raise AssertionError('Renderer failed to include dynamic test project')
              print('[OK] projects.yml injection test passed successfully.')
          finally:
              if Path('README.test.md').exists():
                  Path('README.test.md').unlink()
              shutil.move('data/projects.yml.bak', 'data/projects.yml')
          "
